<html><head><base href="https://wilmerdelgadocieza.blogspot.com/"> 


<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ WILMER EN VIVO</title>
    <style>
        :root {
            --primary-red: #ff0000;
            --dark: #000000;
            --light: #ffffff;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: var(--dark);
            color: var(--light);
        }

        .header {
            background: var(--primary-red);
            padding: 10px;
            text-align: center;
        }

        .logo {
            max-width: 300px;
            height: auto;
        }

        .player-container {
            max-width: 800px;
            margin: 20px auto;
            text-align: center;
            padding: 15px;
        }

        .player-box {
            background: var(--primary-red);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .play-btn {
            background: var(--dark);
            color: var(--light);
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
        }

        .play-btn:hover {
            background: #333;
        }

        .social-links {
            margin: 20px 0;
        }

        .social-btn {
            background: var(--primary-red);
            color: var(--light);
            text-decoration: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            display: inline-block;
        }

        .now-playing {
            background: rgba(255,0,0,0.8);
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }

        .chat-container {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .volume-control {
            margin: 20px 0;
        }

        .volume-control input {
            width: 200px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .live-indicator {
            color: var(--primary-red);
            animation: pulse 2s infinite;
            font-weight: bold;
        }

        footer {
            background: var(--primary-red);
            padding: 20px;
            text-align: center;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .player-container {
                padding: 10px;
            }
            
            .logo {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <img src="https://i.ibb.co/mhw9LGh/DJ-WILMER-PNG-ORIGINAL.png" 
             alt="En vivo desde camporredondo Luya Amazonas "
             class="logo"
             width="300"
             height="100">
    </header>

    <main class="player-container">
        <div class="player-box">
            <h2>ESCÚCHANOS EN VIVO</h2>
            <div class="now-playing">
                <span class="live-indicator">● EN VIVO</span>
                <div id="currentSong">DJ WILMER</div>
            </div>

            <button class="play-btn" id="playBtn">
                <i class="fas fa-play"></i> REPRODUCIR RADIO
            </button>

            <div class="volume-control">
                <input type="range" id="volume" min="0" max="100" value="80">
            </div>
        </div>

        <div class="social-links">
            <a href="https://web.facebook.com/DJCHOCHOBARWILMER/" class="social-btn" target="_blank">
                Facebook
            </a>
            <a href=" https://www.youtube.com/channel/UCmJFc5f20PHmTwvvX5sONGQ" class="social-btn" target="_blank">
                YouTube
            </a>
            <a href="https://api.whatsapp.com/send?phone=51984335569" class="social-btn" target="_blank">
                WhatsApp
            </a>
        </div>

        <div class="chat-container">
            <h3>SITIO WEB OFICIAL</h3>
            <iframe src="https://wilmerdelgadocieza.blogspot.com/" 
                    width="100%" 
                    height="400" 
                    frameborder="0">
            </iframe>
        </div>
    </main>

    <footer>
        <p>© 2024 Radio Dj Wilmer - La Mejor Musica Variado</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const playBtn = document.getElementById('playBtn');
            const volumeControl = document.getElementById('volume');
            const audio = new Audio(' https://stream.zeno.fm/wttrxavefwzuv');
            let isPlaying = false;

            playBtn.addEventListener('click', () => {
                if(isPlaying) {
                    audio.pause();
                    playBtn.innerHTML = '<i class="fas fa-play"></i> REPRODUCIR RADIO';
                    isPlaying = false;
                } else {
                    audio.play();
                    playBtn.innerHTML = '<i class="fas fa-pause"></i> PAUSAR RADIO';
                    isPlaying = true;
                }
            });

            volumeControl.addEventListener('input', (e) => {
                audio.volume = e.target.value / 100;
            });

            // Simple now playing updater
            function updateNowPlaying() {
                fetch('https://wilmerdelgadocieza.blogspot.com/api/now-playing')
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('currentSong').textContent = data.song;
                    })
                    .catch(err => console.log('Error fetching now playing info'));
            }

            setInterval(updateNowPlaying, 10000);
        });
    </script>
</body>
</html>
https://wilmerdelgadocieza.blogspot.com/
